<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photo Studio Pro Ultimate</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Oswald:wght@400;700&family=Pacifico&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Roboto+Mono:wght@400;700&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
:root{--bg0:#131417;--bg1:#1a1c20;--bg2:#22252a;--bg3:#2b2f35;--bg4:#363b43;--line:#08090b;--line2:#3a3f48;--tx:#dfe3ea;--dim:#8d94a0;--acc:#4c8dff;--acc2:#7fabff;--danger:#ff5d5d;--ok:#3ecf8e;--warn:#ffb84d;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:12px}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg0);color:var(--tx);-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:inherit;outline:none}
svg{display:block}
#app{display:grid;grid-template-rows:30px 42px minmax(0,1fr) 24px;height:100vh;width:100vw}
#menubar{display:flex;align-items:center;background:var(--bg1);border-bottom:1px solid var(--line);padding:0 8px;gap:4px;z-index:20}
.brand{display:flex;align-items:center;gap:7px;margin-right:10px;font-weight:700;letter-spacing:.3px}
.brand i{font-style:normal;background:linear-gradient(135deg,#4c8dff,#a46bff);color:#fff;font-size:9px;padding:2px 5px;border-radius:4px}
#menus{display:flex;gap:2px}
.mb-item{padding:5px 10px;border-radius:5px;color:var(--tx)}
.mb-item:hover,.mb-item.open{background:var(--bg4)}
#docTitle{margin-left:auto;color:var(--dim);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40vw}
#optionsbar{display:flex;align-items:center;gap:12px;padding:0 12px;background:var(--bg2);border-bottom:1px solid var(--line);overflow-x:auto;overflow-y:hidden;white-space:nowrap}
#optionsbar::-webkit-scrollbar{height:4px}
.opt{display:flex;align-items:center;gap:6px;flex:none}
.opt>.lbl{color:var(--dim);font-size:11px}
.opt input[type=range]{width:90px}
.opt .num{width:48px}
.osep{width:1px;height:22px;background:var(--line2);flex:none}
.otool{display:flex;align-items:center;gap:7px;font-weight:600;flex:none;color:var(--acc2)}
.num,.ctl,select.ctl,input.ctl,textarea.ctl{background:var(--bg0);border:1px solid var(--line2);border-radius:4px;height:24px;padding:0 6px;color:var(--tx)}
textarea.ctl{height:auto;padding:6px;resize:vertical;user-select:text}
.num:focus,.ctl:focus{border-color:var(--acc)}
input.num{width:54px;text-align:right}
select.ctl{padding-right:2px}
input[type=color]{width:30px;height:24px;padding:1px;background:var(--bg0);border:1px solid var(--line2);border-radius:4px;cursor:pointer}
input[type=checkbox]{accent-color:var(--acc)}
input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;height:16px;margin:0;min-width:0}
input[type=range]::-webkit-slider-runnable-track{height:4px;background:var(--bg4);border-radius:2px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--acc2);margin-top:-4px;border:0}
input[type=range]::-moz-range-track{height:4px;background:var(--bg4);border-radius:2px}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--acc2);border:0}
.btn{height:26px;padding:0 12px;border-radius:5px;background:var(--bg4);border:1px solid var(--line2);color:var(--tx);white-space:nowrap}
.btn:hover{background:#434952}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.primary:hover{background:#6aa0ff}
.btn.danger{background:#b83a3a;border-color:#b83a3a;color:#fff}
.btn.sm{height:22px;padding:0 8px;font-size:11px}
.btn:disabled{opacity:.45;pointer-events:none}
.seg{display:flex;border:1px solid var(--line2);border-radius:5px;overflow:hidden}
.seg button{padding:0 8px;height:22px;background:var(--bg0);color:var(--dim);display:flex;align-items:center;gap:4px}
.seg button.on{background:var(--acc);color:#fff}
.seg button:hover:not(.on){background:var(--bg3)}
#main{display:flex;min-height:0}
#toolbar{width:78px;background:var(--bg1);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:8px 0;gap:8px;overflow-y:auto;flex:none}
#toolgrid{display:grid;grid-template-columns:repeat(2,34px);gap:3px}
.tool{width:34px;height:34px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#b9bfca;transition:background .15s,color .15s,transform .1s}
.tool:hover{background:var(--bg4);color:#fff}
.tool.on{background:var(--acc);color:#fff;box-shadow:0 0 0 1px #8bb4ff55 inset}
.tool:active{transform:scale(.94)}
#colorbox{position:relative;width:52px;height:52px;margin-top:6px;flex:none}
#fgSw,#bgSw{position:absolute;width:30px;height:30px;border:2px solid #fff;border-radius:4px;cursor:pointer;box-shadow:0 0 0 1px #000}
#fgSw{left:0;top:0;z-index:2}#bgSw{right:0;bottom:0}
#colorbox .mini{position:absolute;font-size:10px;color:var(--dim);cursor:pointer}
#center{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg0)}
#tabs{display:flex;background:var(--bg1);border-bottom:1px solid var(--line);height:30px;overflow-x:auto;flex:none}
#tabs::-webkit-scrollbar{height:3px}
.tab{display:flex;align-items:center;gap:8px;padding:0 10px;border-right:1px solid var(--line);color:var(--dim);cursor:pointer;white-space:nowrap;max-width:200px;flex:none}
.tab span.nm{overflow:hidden;text-overflow:ellipsis}
.tab.on{background:var(--bg2);color:var(--tx);box-shadow:inset 0 -2px var(--acc)}
.tab .mod{color:var(--warn)}
.tab .cl{width:16px;height:16px;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:10px}
.tab .cl:hover{background:var(--bg4)}
#workspace{position:relative;flex:1;min-height:0;display:grid;grid-template-columns:18px minmax(0,1fr);grid-template-rows:18px minmax(0,1fr)}
#rulerCorner{background:var(--bg1);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
#rulerH{grid-column:2;grid-row:1;background:var(--bg1);width:100%;height:18px;cursor:s-resize}
#rulerV{grid-column:1;grid-row:2;background:var(--bg1);width:18px;height:100%;cursor:e-resize}
#stage{grid-column:2;grid-row:2;position:relative;overflow:hidden;background:#17181b}
#view,#overlay{position:absolute;left:0;top:0;width:100%;height:100%}
#overlay{touch-action:none;outline:none}
.nor #workspace{grid-template-columns:0 minmax(0,1fr);grid-template-rows:0 minmax(0,1fr)}
.nor #rulerH,.nor #rulerV,.nor #rulerCorner{display:none}
#emptyState{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;color:var(--dim);text-align:center;pointer-events:none}
#emptyState.on{display:flex}
#emptyState .btn{pointer-events:auto}
#emptyState h2{margin:0;color:var(--tx);font-size:18px}
#resizeV{width:5px;cursor:col-resize;background:var(--line);flex:none}
#resizeV:hover,#resizeH:hover{background:var(--acc)}
#sidebar{width:var(--sbw,310px);display:flex;flex-direction:column;background:var(--bg1);min-height:0;flex:none}
.dock{display:flex;flex-direction:column;min-height:0;overflow:hidden}
#dockTop{height:var(--dth,330px);flex:none}
#dockBottom{flex:1}
#resizeH{height:5px;cursor:row-resize;background:var(--line);flex:none}
.dtabs{display:flex;background:var(--bg2);border-bottom:1px solid var(--line);flex:none;overflow-x:auto}
.dtabs::-webkit-scrollbar{height:0}
.dtab{padding:7px 10px;color:var(--dim);white-space:nowrap;border-bottom:2px solid transparent}
.dtab:hover{color:var(--tx)}
.dtab.on{color:var(--tx);border-bottom-color:var(--acc);background:var(--bg1)}
.dpanels{flex:1;min-height:0;position:relative}
.panel{position:absolute;inset:0;overflow:auto;padding:10px;display:none}
.panel.on{display:block}
.panel.nopad{padding:0}
.panel::-webkit-scrollbar,.modal-b::-webkit-scrollbar{width:8px;height:8px}
.panel::-webkit-scrollbar-thumb,.modal-b::-webkit-scrollbar-thumb,#optionsbar::-webkit-scrollbar-thumb,#tabs::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:4px}
.empty-note{color:var(--dim);text-align:center;padding:24px 12px;line-height:1.6}
.fld{display:flex;align-items:center;gap:8px;margin:6px 0}
.fld>.lbl{width:96px;flex:none;color:var(--dim);font-size:11px}
.fld input[type=range]{flex:1}
.fld .ctl:not(.num){flex:1;min-width:0}
.fld .num{width:56px}
.fld-check{padding-left:0}
.fld-check>.lbl{width:auto;color:var(--tx)}
.fld-info{color:var(--dim);font-size:11px;line-height:1.5;margin:6px 0}
.grp{border:1px solid var(--line2);border-radius:6px;padding:4px 8px;margin:8px 0}
.grp>h4{margin:4px 0 2px;font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:var(--dim);font-weight:600}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:6px 0}
.layer-tools{display:flex;gap:2px;padding:4px 6px;border-top:1px solid var(--line);background:var(--bg2);flex:none}
.ib{width:26px;height:26px;border-radius:5px;display:flex;align-items:center;justify-content:center;color:#b9bfca}
.ib:hover{background:var(--bg4);color:#fff}
.ib.on{color:var(--acc2)}
.ib:disabled{opacity:.35;pointer-events:none}
#layersWrap{display:flex;flex-direction:column;height:100%}
#layerOpts{display:flex;gap:6px;padding:6px;border-bottom:1px solid var(--line);align-items:center;flex:none}
#layerOpts select{width:104px}
#layerList{flex:1;overflow:auto;min-height:0}
.lrow{display:flex;align-items:center;gap:6px;height:44px;padding:0 6px;border-bottom:1px solid #00000040;cursor:pointer;position:relative}
.lrow:hover{background:var(--bg3)}
.lrow.sel{background:#2d4a7a}
.lrow.act{background:#35609f}
.lrow.dropT::before,.lrow.dropB::after{content:"";position:absolute;left:0;right:0;height:2px;background:var(--acc2)}
.lrow.dropT::before{top:0}.lrow.dropB::after{bottom:0}
.lrow.dropI{outline:2px dashed var(--acc2);outline-offset:-2px}
.lrow .vis{width:20px;color:var(--dim);flex:none}
.lrow .vis.off{opacity:.35}
.lrow .thumb,.lrow .mthumb{width:34px;height:34px;border-radius:3px;flex:none;background-image:linear-gradient(45deg,#555 25%,transparent 25%,transparent 75%,#555 75%),linear-gradient(45deg,#555 25%,transparent 25%,transparent 75%,#555 75%);background-size:8px 8px;background-position:0 0,4px 4px;background-color:#777;border:1px solid #000}
.lrow .mthumb{background:#000}
.lrow .mthumb.on{outline:2px solid var(--acc2)}
.lrow canvas{width:100%;height:100%;display:block;border-radius:2px}
.lrow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .nm small{display:block;color:var(--dim);font-size:10px}
.lrow .ico{color:var(--dim);flex:none;display:flex;gap:2px}
.lrow input.rn{flex:1;min-width:0;background:var(--bg0);border:1px solid var(--acc);border-radius:3px;color:var(--tx);height:22px;padding:0 4px}
.hrow{padding:6px 10px;cursor:pointer;border-bottom:1px solid #00000030;display:flex;gap:8px;align-items:center}
.hrow:hover{background:var(--bg3)}
.hrow.cur{background:#35609f}
.hrow.future{opacity:.45}
.sw-grid{display:grid;grid-template-columns:repeat(auto-fill,22px);gap:4px;margin:8px 0}
.sw{width:22px;height:22px;border-radius:4px;border:1px solid #000;cursor:pointer}
.sw:hover{transform:scale(1.15)}
.adj-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.adj-grid .btn{height:30px;text-align:left;display:flex;align-items:center;gap:6px}
#navCanvas{width:100%;display:block;background:#000;border-radius:4px;cursor:crosshair;margin-bottom:8px}
.chan{display:flex;align-items:center;gap:8px;padding:6px 8px;border-bottom:1px solid #00000030;cursor:pointer}
.chan canvas{width:44px;height:30px;background:#000;border:1px solid #000}
.chan:hover{background:var(--bg3)}
.chan .e{width:18px;color:var(--dim)}
.chan .e.off{opacity:.25}
#svCanvas{width:100%;height:130px;border-radius:4px;display:block;cursor:crosshair;touch-action:none}
#hueRange{width:100%;margin:8px 0;background:linear-gradient(90deg,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00);border-radius:4px;height:10px}
#hueRange::-webkit-slider-runnable-track{background:transparent}
#hueRange::-moz-range-track{background:transparent}
.cgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.cgrid label{display:flex;flex-direction:column;gap:2px;color:var(--dim);font-size:10px}
.cgrid input{width:100%;text-align:center}
#statusbar{display:flex;align-items:center;gap:16px;padding:0 10px;background:var(--bg1);border-top:1px solid var(--line);color:var(--dim);font-size:11px;white-space:nowrap}
#statusbar .sp{flex:1;overflow:hidden;text-overflow:ellipsis}
#statusbar button{color:var(--dim);padding:0 6px;height:18px;border-radius:3px}
#statusbar button:hover{background:var(--bg4);color:var(--tx)}
#zoomVal{width:52px;text-align:center;background:var(--bg0);border:1px solid var(--line2);border-radius:3px;height:18px;color:var(--tx)}
.menu-pop{position:fixed;z-index:1000}
.menu{background:#202329;border:1px solid #444a54;border-radius:8px;padding:5px;min-width:210px;box-shadow:0 12px 40px #000a;animation:pop .12s ease}
.mitem{position:relative;display:flex;align-items:center;gap:6px;padding:5px 8px;border-radius:5px;cursor:pointer;white-space:nowrap}
.mitem:hover{background:var(--acc);color:#fff}
.mitem.dis{opacity:.4;pointer-events:none}
.mchk{width:12px;font-size:10px}
.mlab{flex:1}
.msc{color:var(--dim);font-size:11px;margin-left:24px}
.mitem:hover>.msc{color:#dfe9ff}
.msep{height:1px;background:#3a3f48;margin:4px 2px}
.submenu{display:none;position:absolute;left:100%;top:-6px;margin-left:2px}
.mitem:hover>.submenu{display:block}
@keyframes pop{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.modal-back{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:900;animation:fade .15s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:#22252b;border:1px solid #444a54;border-radius:10px;box-shadow:0 24px 80px #000c;max-width:96vw;max-height:92vh;display:flex;flex-direction:column;animation:pop .15s ease}
.modal-h{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line2);font-weight:600;font-size:13px}
.modal-h .x{color:var(--dim);width:22px;height:22px;border-radius:4px}
.modal-h .x:hover{background:var(--bg4);color:#fff}
.modal-b{padding:14px 16px;overflow:auto;min-height:0}
.modal-f{display:flex;justify-content:flex-end;gap:8px;padding:12px 16px;border-top:1px solid var(--line2)}
.modal .msg{margin:4px 0;line-height:1.6;user-select:text}
.modal.wide .modal-b{padding:0}
.fxwrap{display:grid;grid-template-columns:1fr 280px;height:min(520px,70vh)}
.fxgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px;padding:12px;overflow:auto;align-content:start}
.fxcard{background:var(--bg1);border:2px solid transparent;border-radius:8px;padding:4px;cursor:pointer;text-align:center;font-size:11px}
.fxcard canvas{width:100%;aspect-ratio:3/2;display:block;border-radius:4px;background:#000}
.fxcard:hover{background:var(--bg3)}
.fxcard.on{border-color:var(--acc)}
.fxside{border-left:1px solid var(--line2);padding:12px;overflow:auto}
.fxcat{grid-column:1/-1;color:var(--dim);font-size:10px;text-transform:uppercase;letter-spacing:.8px;margin-top:4px}
#toasts{position:fixed;right:14px;bottom:34px;display:flex;flex-direction:column;gap:8px;z-index:2000;pointer-events:none}
.toast{background:#262a31;border:1px solid #4a505a;border-left:4px solid var(--acc);padding:9px 14px;border-radius:8px;box-shadow:0 8px 30px #0009;max-width:360px;animation:pop .2s ease;transition:opacity .3s,transform .3s}
.toast.error{border-left-color:var(--danger)}.toast.warn{border-left-color:var(--warn)}.toast.ok{border-left-color:var(--ok)}
.toast.out{opacity:0;transform:translateX(20px)}
#tip{position:fixed;z-index:3000;background:#0b0c0e;color:#e9ecf2;border:1px solid #3a3f48;padding:4px 8px;border-radius:5px;font-size:11px;pointer-events:none;opacity:0;transition:opacity .12s;max-width:260px}
#tip.on{opacity:1}
#progress{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;z-index:2500}
#progress.on{display:flex}
#progress .box{background:#22252b;border:1px solid #444a54;padding:18px 24px;border-radius:10px;min-width:260px;text-align:center}
#progress .bar{height:6px;background:var(--bg4);border-radius:3px;margin-top:12px;overflow:hidden}
#progress .bar i{display:block;height:100%;width:40%;background:var(--acc);border-radius:3px;animation:ind 1s infinite ease-in-out}
@keyframes ind{0%{margin-left:-40%}100%{margin-left:100%}}
#welcome{position:fixed;inset:0;z-index:800;background:radial-gradient(circle at 30% 20%,#25303f,#101216 70%);display:none;align-items:center;justify-content:center;padding:20px;overflow:auto}
#welcome.on{display:flex}
.wcard{width:min(940px,100%);display:grid;grid-template-columns:1fr 1fr;gap:28px}
.wcard h1{font-size:30px;margin:0 0 6px;letter-spacing:-.5px}
.wcard h1 span{background:linear-gradient(90deg,#4c8dff,#b57bff);-webkit-background-clip:text;background-clip:text;color:transparent}
.wcard p{color:var(--dim);line-height:1.6}
.wbtns{display:flex;flex-direction:column;gap:8px;margin:18px 0}
.wbtns .btn{height:40px;text-align:left;padding:0 14px;font-size:13px;display:flex;align-items:center;gap:10px}
.recent{background:#181a1ecc;border:1px solid var(--line2);border-radius:12px;padding:14px;max-height:430px;overflow:auto}
.recent h3{margin:0 0 10px;font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--dim)}
.rcard{display:flex;gap:10px;align-items:center;padding:8px;border-radius:8px;cursor:pointer}
.rcard:hover{background:var(--bg3)}
.rcard img{width:56px;height:42px;object-fit:cover;border-radius:4px;background:#000}
.rcard small{color:var(--dim);display:block}
.rcard .rm{margin-left:auto;color:var(--dim);padding:4px 7px;border-radius:4px}
.rcard .rm:hover{background:var(--danger);color:#fff}
#dropHint{position:fixed;inset:0;z-index:700;border:3px dashed var(--acc);background:#4c8dff22;display:none;align-items:center;justify-content:center;font-size:22px;color:#fff;pointer-events:none}
#dropHint.on{display:flex}
#tutHi{position:fixed;z-index:3500;border:2px solid var(--acc2);border-radius:8px;box-shadow:0 0 0 9999px #0008;pointer-events:none;transition:all .25s}
#tutCard{position:fixed;z-index:3600;width:310px;background:#22252b;border:1px solid var(--acc);border-radius:10px;padding:14px;box-shadow:0 12px 50px #000a}
#tutCard h4{margin:0 0 6px;font-size:13px}
#tutCard p{margin:0 0 12px;color:#c5cad4;line-height:1.55}
.curve-wrap canvas{width:100%;aspect-ratio:1;background:#0b0c0e;border:1px solid var(--line2);border-radius:4px;touch-action:none;cursor:crosshair}
.gradbar{height:28px;border-radius:5px;border:1px solid #000;background-image:linear-gradient(45deg,#666 25%,transparent 25%,transparent 75%,#666 75%),linear-gradient(45deg,#666 25%,transparent 25%,transparent 75%,#666 75%);background-size:10px 10px;background-position:0 0,5px 5px;position:relative}
.gradbar>i{position:absolute;inset:0;border-radius:4px}
.gtrack{height:22px;position:relative;cursor:copy;margin-top:2px}
.gstop{position:absolute;top:2px;width:14px;height:18px;margin-left:-7px;border:2px solid #fff;border-radius:3px;cursor:grab;box-shadow:0 0 0 1px #000}
.gstop.on{border-color:var(--acc2);box-shadow:0 0 0 2px var(--acc)}
.gpre{display:grid;grid-template-columns:repeat(auto-fill,64px);gap:6px;margin-top:10px}
.gpre div{height:22px;border-radius:4px;border:1px solid #000;cursor:pointer}
.gpre div:hover{outline:2px solid var(--acc)}
.kbd{display:grid;grid-template-columns:1fr 1fr;gap:4px 24px}
.kbd div{display:flex;justify-content:space-between;border-bottom:1px solid #0003;padding:3px 0}
.kbd kbd{background:var(--bg4);padding:1px 6px;border-radius:4px;font-family:inherit;font-size:11px}
.aicard{border:1px solid var(--line2);border-radius:8px;padding:10px;margin-bottom:8px;background:var(--bg2)}
.aicard b{display:block;margin-bottom:2px}

const $ = (s, r = document) => r.querySelector(s);

/* ---------- icons ---------- */

const icon = (n, s = 18, sw = 1.7) => `<svg viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${ICONS[n] || ''}</svg>`;

/* ---------- toast / progress ---------- */
const toast = (msg, kind = 'info', ms = 3200) => {
  const t = h('div', { class: 'toast ' + kind, text: msg });
  $('#toasts').append(t);
  setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 320); }, ms);
};
const setStatus = m => { $('#statusMsg').textContent = m; };
const Progress = {
  async run(label, fn) {
    const el = $('#progress'); $('#progressLabel').textContent = label; el.classList.add('on');
    await new Promise(r => requestAnimationFrame(() => setTimeout(r, 25)));
    try { return await fn(); }
    catch (e) { console.error(e); toast('Error: ' + (e && e.message || e), 'error', 5500); }
    finally { el.classList.remove('on'); }
  }
};

/* ---------- form fields ---------- */
function makeField(def, onInput, onChange) {
  const id = 'f' + uid();
  const row = h('div', { class: 'fld' + (def.type === 'checkbox' ? ' fld-check' : '') + (def.type === 'info' ? ' fld-info' : '') });
  const lab = def.label && def.type !== 'checkbox' && def.type !== 'info' ? h('label', { class: 'lbl', for: id, text: def.label }) : null;
  let get, set;
  const fire = c => { onInput && onInput(def.key, get()); if (c) onChange && onChange(def.key, get()); };
  switch (def.type) {
    case 'range': {
      const r = h('input', { type: 'range', id, min: def.min, max: def.max, step: def.step || 1 });
      const n = h('input', { type: 'number', class: 'num', min: def.min, max: def.max, step: def.step || 1 });
      r.value = n.value = def.value;
      r.addEventListener('input', () => { n.value = r.value; fire(false); });
      r.addEventListener('change', () => fire(true));
      n.addEventListener('input', () => { if (n.value === '' || isNaN(+n.value)) return; r.value = n.value; fire(false); });
      n.addEventListener('change', () => { n.value = clamp(+n.value || 0, +def.min, +def.max); r.value = n.value; fire(true); });
      get = () => +r.value; set = v => { r.value = n.value = v; };
      row.append(lab, r, n); break;
    }
    case 'number': {
      const n = h('input', { type: 'number', id, class: 'ctl num', min: def.min, max: def.max, step: def.step || 1 });
      n.value = def.value;
      n.addEventListener('input', () => { if (n.value !== '' && !isNaN(+n.value)) fire(false); });
      n.addEventListener('change', () => { if (def.min != null) n.value = clamp(+n.value || 0, +def.min, +(def.max == null ? 1e9 : def.max)); fire(true); });
      get = () => +n.value; set = v => { n.value = v; }; row.append(lab, n); break;
    }
    case 'select': {
      const s = h('select', { id, class: 'ctl' }, (def.options || []).map(o => { const v = Array.isArray(o) ? o[0] : o, l = Array.isArray(o) ? o[1] : o; return h('option', { value: v, text: l }); }));
      s.value = def.value;
      s.addEventListener('change', () => fire(true));
      get = () => def.num ? +s.value : s.value; set = v => { s.value = v; }; row.append(lab, s); break;
    }
    case 'checkbox': {
      const c = h('input', { type: 'checkbox', id }); c.checked = !!def.value;
      c.addEventListener('change', () => fire(true));
      get = () => c.checked; set = v => { c.checked = !!v; };
      row.append(c, h('label', { class: 'lbl', for: id, text: def.label })); break;
    }
    case 'color': {
      const c = h('input', { type: 'color', id }); c.value = def.value || '#000000';
      c.addEventListener('input', () => fire(false)); c.addEventListener('change', () => fire(true));
      get = () => c.value; set = v => { c.value = v; }; row.append(lab, c); break;
    }
    case 'textarea': {
      const t = h('textarea', { id, class: 'ctl', rows: def.rows || 3 }); t.value = def.value || '';
      t.addEventListener('input', () => fire(false)); t.addEventListener('change', () => fire(true));
      get = () => t.value; set = v => { t.value = v; }; row.append(lab, t); break;
    }
    case 'info': { row.textContent = def.label || ''; get = () => null; set = () => { }; break; }
    default: {
      const t = h('input', { type: 'text', id, class: 'ctl' }); t.value = def.value == null ? '' : def.value;
      t.addEventListener('input', () => fire(false)); t.addEventListener('change', () => fire(true));

function makeForm(defs, onInput, onChange) {
  const fields = {}; const el = h('div', { class: 'form' });
  defs.forEach(d => { const f = makeField(d, (k, v) => onInput && onInput(k, v, form), (k, v) => onChange && onChange(k, v, form)); if (d.key) fields[d.key] = f; el.append(f.el); });
  const form = { el, fields, values() { const o = {}; for (const k in fields) o[k] = fields[k].get(); return o; }, set(k, v) { fields[k] && fields[k].set(v); } };
  return form;
}

/* ---------- dialogs ---------- */
const Dialog = {
  stack: [],
  open({ title, body, buttons = [], width = 440, onClose, cls = '' }) {
    const back = h('div', { class: 'modal-back' });
    let closed = false;
    const api = {};
    const close = r => { if (closed) return; closed = true; back.remove(); const i = Dialog.stack.indexOf(api); if (i >= 0) Dialog.stack.splice(i, 1); onClose && onClose(r); };
    const foot = h('div', { class: 'modal-f' }, buttons.map(b => h('button', { class: 'btn' + (b.primary ? ' primary' : '') + (b.danger ? ' danger' : ''), text: b.text, onclick: () => { if (b.onClick) { if (b.onClick(close, api) === false) return; } else close(b.value); } })));
    const box = h('div', { class: 'modal ' + cls, style: { width: width + 'px' }, role: 'dialog', 'aria-modal': 'true' },
      h('div', { class: 'modal-h' }, h('span', { text: title }), h('button', { class: 'x', text: '✕', 'aria-label': 'Close', onclick: () => close() })),
      h('div', { class: 'modal-b' }, body), buttons.length ? foot : null);
    back.append(box);
    back.addEventListener('keydown', e => { if (e.key === 'Enter' && !/TEXTAREA|BUTTON|SELECT/.test(e.target.tagName)) { const p = box.querySelector('.btn.primary'); if (p) { e.preventDefault(); p.click(); } } });
    document.body.append(back);
    Object.assign(api, { close, el: box, body: box.querySelector('.modal-b') });
    Dialog.stack.push(api);
    const f = box.querySelector('input:not([type=range]):not([type=checkbox]),select,textarea'); if (f && !def_noFocus) f.focus();
    return api;
  },
  confirm(msg, o = {}) {
    return new Promise(res => Dialog.open({ title: o.title || 'Confirm', body: h('p', { class: 'msg', text: msg }), width: 400, buttons: [{ text: o.cancel || 'Cancel', value: false }, { text: o.ok || 'OK', primary: true, danger: o.danger, value: true }], onClose: r => res(!!r) }));
  },
  alert(msg, title = 'Notice') { return new Promise(res => Dialog.open({ title, body: h('p', { class: 'msg', text: msg }), width: 400, buttons: [{ text: 'OK', primary: true, value: true }], onClose: () => res() })); },
  prompt(msg, def = '', title = 'Input') {
    return new Promise(res => {
      const inp = h('input', { type: 'text', class: 'ctl', style: { width: '100%', marginTop: '8px' } }); inp.value = def;
      Dialog.open({ title, body: [h('div', { text: msg }), inp], width: 380, buttons: [{ text: 'Cancel', value: null }, { text: 'OK', primary: true, onClick: c => { c(inp.value); } }], onClose: r => res(typeof r === 'string' ? r : null) });
      setTimeout(() => { inp.focus(); inp.select(); }, 30);
    });
  },
  form({ title, fields, ok = 'OK', width = 420, onInput, onOk, onCancel, top, cancelText = 'Cancel', extraButtons = [] }) {
    const form = makeForm(fields, (k, v, f) => onInput && onInput(f.values(), k));
    const dlg = Dialog.open({
      title, body: [top || null, form.el], width,
      buttons: [...extraButtons, { text: cancelText, onClick: c => c(false) }, { text: ok, primary: true, onClick: c => { const r = onOk && onOk(form.values()); if (r === false) return false; c(true); } }],
      onClose: r => { if (r !== true) onCancel && onCancel(); }
    });

  }
};
const def_noFocus = false;

/* ---------- tooltips ---------- */
const Tip = {
  el: null, t: null,
  init() {
    this.el = $('#tip');
    document.addEventListener('pointerover', e => {
      const t = e.target.closest && e.target.closest('[data-tip]'); clearTimeout(this.t);
      if (!t) { this.hide(); return; }
      this.t = setTimeout(() => this.show(t), 350);
    });
    document.addEventListener('pointerdown', () => { clearTimeout(this.t); this.hide(); });
  },
  show(t) {
    if (!document.body.contains(t)) return;
    const r = t.getBoundingClientRect(); this.el.textContent = t.dataset.tip; this.el.classList.add('on');
    const w = this.el.offsetWidth, hh = this.el.offsetHeight;
    let x = r.left, y = r.bottom + 6;
    if (x + w > innerWidth - 6) x = innerWidth - w - 6;
    if (y + hh > innerHeight - 6) y = r.top - hh - 6;
    this.el.style.left = Math.max(4, x) + 'px'; this.el.style.top = y + 'px';
  },
  hide() { this.el && this.el.classList.remove('on'); }

/* ---------- menus / context menus ---------- */
const Menu = {
  el: null, openFor: null,
  node(items, close) {
    const ul = h('div', { class: 'menu' });
    for (const it of items) {
      if (it === 'sep') { ul.append(h('div', { class: 'msep' })); continue; }
      const dis = typeof it.disabled === 'function' ? it.disabled() : it.disabled;
      const chk = typeof it.checked === 'function' ? it.checked() : it.checked;
      const row = h('div', { class: 'mitem' + (dis ? ' dis' : '') }, h('span', { class: 'mchk', text: chk ? '✓' : '' }), h('span', { class: 'mlab', text: it.label }), h('span', { class: 'msc', text: it.sub ? '▸' : (it.shortcut || '') }));
      if (it.sub) { const sub = this.node(it.sub, close); sub.classList.add('submenu'); row.append(sub); }
      else row.addEventListener('click', e => { e.stopPropagation(); close(); if (it.action) { try { it.action(); } catch (err) { console.error(err); toast('Error: ' + err.message, 'error'); } } });
      ul.append(row);
    }
    return ul;
  },

App.setAutosave = () => { clearInterval(App._at); const s = Prefs.get('autosave', 30); if (s > 0) App._at = setInterval(() => App.autosave(), s * 1000); };
App.autosave = async () => { if (!Store.db) return; for (const d of App.docs) { if (!d.modified) continue; const sig = d.hist.idx + '|' + d.hist.states.length + '|' + (d.hist.states[d.hist.idx] || {}).time; if (d._autoSig === sig) continue; try { if (await Store.saveDoc(d, true)) { d._autoSig = sig; setStatus('Autosaved ' + new Date().toLocaleTimeString()); } } catch (e) { console.error('Autosave failed', e); } } };
function initKeys() {
  const lookup = {}; Tools.order.forEach(id => { const k = Tools.list[id].shortcut; if (k) lookup[k] = id; });

    if (e.altKey && !ctrl) { if (k === 't') { e.preventDefault(); Transform.start(); return; } if (k === 'n') { e.preventDefault(); newDocDialog(); return; } if (e.key === 'Backspace') { e.preventDefault(); EditOps.fill(Color.fg); return; } }

      switch (k) {

        case 'z': stop(); e.shiftKey ? Hist.redo() : Hist.undo(); return; case 'y': stop(); Hist.redo(); return; case 'j': stop(); LM.duplicate(); return; case 't': stop(); Transform.start(); return;
        case 'a': stop(); if (d) d.setSelection(Selection.all(d.w, d.h), 'Select All'); return; case 'd': stop(); if (d && d.selection) d.setSelection(null, 'Deselect'); return;
        case 'i': if (e.shiftKey) { stop(); if (d && d.selection) d.setSelection(d.selection.invert(), 'Invert Selection'); } return;
        case 'g': stop(); e.shiftKey ? LM.ungroup() : LM.group(); return; case 'e': stop(); LM.mergeDown(); return; case 'n': stop(); e.shiftKey ? LM.newLayer() : newDocDialog(); return; case 'w': stop(); if (d) Docs.close(d.id); return;
        case 'c': stop(); EditOps.copy(false); return; case 'x': stop(); EditOps.copy(true); return; case 'v': return; case '0': stop(); View.fit(); return; case '1': stop(); View.setZoom(1); return;
        case '=': case '+': stop(); View.zoomAt(1.25); return; case '-': stop(); View.zoomAt(1 / 1.25); return; case 'backspace': stop(); EditOps.fill(Color.bg); return;

    }

    if (Tools.curId === 'move' && e.key.startsWith('Arrow')) { e.preventDefault(); const s = e.shiftKey ? 10 : 1; Tools.cur.nudge(e.key === 'ArrowLeft' ? -s : e.key === 'ArrowRight' ? s : 0, e.key === 'ArrowUp' ? -s : e.key === 'ArrowDown' ? s : 0); return; }
    if (e.key === '[' || e.key === ']') { const o = O[Tools.curId]; if (o && o.size) { let n = Math.round(o.size * (e.key === ']' ? 1.12 : 1 / 1.12)); if (n === o.size) n += e.key === ']' ? 1 : -1; o.size = clamp(n, 1, 500); OB.save(); Tools.renderBar(); View.odirty(); } return; }
    if (e.key === '+' || e.key === '=') { View.zoomAt(1.25); return; } if (e.key === '-') { View.zoomAt(1 / 1.25); return; }

}
function initIO() {
  $('#fileImage').addEventListener('change', e => { const f = e.target.files; if (f && f.length) Docs.openFiles(f, false); e.target.value = ''; });
  $('#fileProject').addEventListener('change', e => { const f = e.target.files[0]; if (f) Store.openProjectFile(f).catch(err => toast(err.message, 'error', 5000)); e.target.value = ''; });
  $('#filePlace').addEventListener('change', e => { const f = e.target.files; if (f && f.length) Docs.openFiles(f, true); e.target.value = ''; });
  let dc = 0; const hint = $('#dropHint'), hasFiles = e => e.dataTransfer && Array.from(e.dataTransfer.types || []).includes('Files');
  window.addEventListener('dragenter', e => { if (hasFiles(e)) { dc++; hint.classList.add('on'); } }); window.addEventListener('dragleave', e => { if (hasFiles(e)) { dc = Math.max(0, dc - 1); if (!dc) hint.classList.remove('on'); } });
  window.addEventListener('dragover', e => { if (hasFiles(e)) e.preventDefault(); });
  window.addEventListener('drop', e => { if (!hasFiles(e)) return; e.preventDefault(); dc = 0; hint.classList.remove('on'); $('#welcome').classList.remove('on'); Docs.openFiles(e.dataTransfer.files, !!App.doc); });

    if (items.length) { e.preventDefault(); const f = items[0].getAsFile(); if (f) Docs.openFiles([new File([f], 'Pasted-image.' + (f.type.split('/')[1] || 'png'), { type: f.type })], !!App.doc); return; }

  });

}
function emptyState() {

  Tip.init(); Pix.init(); buildMenubar(); Tools.buildToolbar(); Panels.init(); View.init(); initResizers(); initKeys(); initIO(); emptyState(); setDynamicGradient(); updateSwatchBox();
